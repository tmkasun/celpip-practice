# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

scripts:
  buildCommand: pnpm build
  runCommand: node server/index.cjs

env:
  - variable: WRITING_AI_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: GEMINI_GRADING_FALLBACK_MODEL
    value: gemini-3.5-flash
    availability:
      - RUNTIME
  - variable: GEMINI_API_KEY
    secret: celpip-gemini-api-key@1
    availability:
      - RUNTIME
